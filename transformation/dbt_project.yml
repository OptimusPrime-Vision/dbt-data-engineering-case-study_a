name: 'dbt_interview'
version: '1.0.0'
config-version: 2

profile: 'default'

flags:
  send_anonymous_usage_stats: false

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

models:
  dbt_interview:
    +database: dbt
    +persist_docs:
      relation: true
      columns: true

    staging:
      +schema: staging
      +materialized: view
      +tags: ["staging"]

    intermediate:
      +materialized: table
      +schema: intermediate
      +tags: ["intermediate"]

    marts:
      +schema: marts
      +materialized: table
      +tags: ["marts"]
      core:
        +tags: ["core"]
      finance:
        +tags: ["finance"]
      sales:
        +tags: ["sales"]
      service:
        +tags: ["service"]

seeds:
  dbt_interview:
    +database: dbt
    +schema: seeds

snapshots:
  dbt_interview:
    +database: dbt
    +target_schema: snapshots

vars:
  "dbt_date:time_zone": "Europe/Berlin"

version: 2

models:
  - name: stg_salesforce__account
    description: "Renamed Salesforce Account records. One row per account."
    columns:
      - name: account_id
        description: "Primary key — Salesforce Account ID."
        tests: [unique, not_null]
      - name: name
        tests: [not_null]
      - name: ownerid
        tests: [not_null]
      - name: isdeleted
        tests: [not_null]

  - name: stg_salesforce__campaign
    description: "Renamed Salesforce Campaign records."
    columns:
      - name: campaign_id
        description: "Primary key."
        tests: [unique, not_null]
      - name: name
        tests: [not_null]
      - name: status
        tests:
          - accepted_values:
              values: ['Planned', 'In Progress', 'Completed', 'Aborted']
              severity: warn

  - name: stg_salesforce__case
    description: "Renamed Salesforce Case (support ticket) records."
    columns:
      - name: case_id
        description: "Primary key."
        tests: [unique, not_null]
      - name: status
        tests:
          - accepted_values:
              values: ['New', 'Working', 'Escalated', 'Closed']
              severity: warn
      - name: priority
        tests:
          - accepted_values:
              values: ['Low', 'Medium', 'High', 'Critical']
              severity: warn

  - name: stg_salesforce__case_history_2
    description: "Field-level change history for cases."
    columns:
      - name: case_history_id
        description: "Primary key."
        tests: [unique, not_null]
      - name: caseid
        tests: [not_null]

  - name: stg_salesforce__contact
    description: "Renamed Salesforce Contact records."
    columns:
      - name: contact_id
        description: "Primary key."
        tests: [unique, not_null]
      - name: accountid
        tests: [not_null]

  - name: stg_salesforce__lead
    description: "Renamed Salesforce Lead records."
    columns:
      - name: lead_id
        description: "Primary key."
        tests: [unique, not_null]
      - name: isconverted
        tests: [not_null]

  - name: stg_salesforce__opportunity
    description: "Renamed Salesforce Opportunity records."
    columns:
      - name: opportunity_id
        description: "Primary key."
        tests: [unique, not_null]
      - name: accountid
        tests: [not_null]
      - name: ownerid
        tests: [not_null]
      - name: iswon
        tests: [not_null]
      - name: isclosed
        tests: [not_null]
      - name: stagename
        tests:
          - accepted_values:
              values: ['Prospecting', 'Qualification', 'Needs Analysis',
                       'Value Proposition', 'Id. Decision Makers',
                       'Perception Analysis', 'Proposal/Price Quote',
                       'Negotiation/Review', 'Closed Won', 'Closed Lost']
              severity: warn

  - name: stg_salesforce__opportunity_history
    description: "Stage-level change history for opportunities."
    columns:
      - name: opportunity_history_id
        description: "Primary key."
        tests: [unique, not_null]
      - name: opportunityid
        tests: [not_null]

  - name: stg_salesforce__pricebook_entry
    description: "Renamed Salesforce PricebookEntry records."
    columns:
      - name: pricebook_entry_id
        description: "Primary key."
        tests: [unique, not_null]
      - name: product2id
        tests: [not_null]
      - name: unitprice
        tests: [not_null]

  - name: stg_salesforce__product_2
    description: "Renamed Salesforce Product2 catalogue records."
    columns:
      - name: product_id
        description: "Primary key."
        tests: [unique, not_null]
      - name: name
        tests: [not_null]

  - name: stg_salesforce__record_type
    description: "Salesforce RecordType definitions."
    columns:
      - name: record_type_id
        description: "Primary key."
        tests: [unique, not_null]
      - name: sobjecttype
        tests: [not_null]

  - name: stg_salesforce__solution
    description: "Salesforce Solution (knowledge base) records."
    columns:
      - name: solution_id
        description: "Primary key."
        tests: [unique, not_null]

  - name: stg_salesforce__user
    description: "Renamed Salesforce User records."
    columns:
      - name: user_id
        description: "Primary key."
        tests: [unique, not_null]
      - name: email
        tests: [not_null]
      - name: isactive
        tests: [not_null]

  - name: stg_salesforce__user_role
    description: "Salesforce UserRole hierarchy records."
    columns:
      - name: user_role_id
        description: "Primary key."
        tests: [unique, not_null]
      - name: name
        tests: [not_null]

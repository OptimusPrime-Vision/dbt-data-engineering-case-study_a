version: 2

models:
  - name: dim_accounts
    description: "Conformed account dimension with surrogate key and pre-computed KPIs. One row per account."
    columns:
      - name: account_key
        description: "Surrogate PK (MD5 of account_id)."
        tests: [unique, not_null]
      - name: account_id
        description: "Salesforce natural key."
        tests: [unique, not_null]
      - name: account_health_tier
        tests:
          - accepted_values:
              values: ['Platinum', 'Gold', 'Silver', 'Bronze']

  - name: dim_users
    description: "Sales rep dimension with role hierarchy and performance metrics. One row per user."
    columns:
      - name: user_key
        description: "Surrogate PK."
        tests: [unique, not_null]
      - name: user_id
        tests: [unique, not_null]
      - name: revenue_quartile
        tests:
          - accepted_values:
              values: [1, 2, 3, 4]
              quote: false

  - name: dim_products
    description: "Product catalogue dimension joined with standard list price. One row per product."
    columns:
      - name: product_key
        tests: [unique, not_null]
      - name: product_id
        tests: [unique, not_null]
      - name: product_name
        tests: [not_null]

  - name: dim_campaigns
    description: "Marketing campaign dimension with ROI and lead conversion metrics. One row per campaign."
    columns:
      - name: campaign_key
        tests: [unique, not_null]
      - name: campaign_id
        tests: [unique, not_null]

  - name: dim_date
    description: "Date dimension generated by dbt_date. Covers 2018-01-01 to 2030-12-31."
    columns:
      - name: date_id
        description: "Natural PK — calendar date."
        tests: [unique, not_null]
      - name: is_weekend
        tests: [not_null]
